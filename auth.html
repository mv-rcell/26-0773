<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Zone | Authenticate</title>
   <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
        body { background-color: #0d0e12; color: #e0e6ed; font-family: 'Segoe UI', sans-serif; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        nav { background-color: #151821; padding: 15px 0; text-align: center; border-bottom: 2px solid #ff4655; }
        nav a { color: #fff; text-decoration: none; margin: 0 15px; font-weight: bold; }
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 250px);
            padding: 40px 20px;
        }

        .auth-card {
            background-color: #151821;
            border: 1px solid #232734;
            border-radius: 8px;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-left: 5px solid #ff4655;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #232734;
        }

        .auth-tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #e0e6ed;
            font-size: 1rem;
            font-weight: bold;
            padding: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .auth-tab-btn:hover {
            color: #ff4655;
            background-color: rgba(255, 70, 85, 0.05);
        }

        .auth-tab-btn.active {
            color: #ff4655;
            border-bottom: 3px solid #ff4655;
            background-color: rgba(255, 70, 85, 0.08);
        }

        .form-container { display: none; }
        .form-container.active { display: block; }

        .form-group { margin-bottom: 22px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #fff;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0d0e12;
            border: 1px solid #232734;
            border-radius: 4px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff4655;
            box-shadow: 0 0 8px rgba(255, 70, 85, 0.2);
            background: #151821;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #ff4655;
            border: none;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 70, 85, 0.3);
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            background: #e03b48;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 70, 85, 0.4);
        }

        .submit-btn:active { transform: translateY(0); }

        .auth-msg {
            margin-top: 20px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: bold;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="auth.html" id="nav-auth">Sign In</a>
        </div>
    </nav>

    <header>
        <h1>Authentication Portal</h1>
    </header>

    <div class="container auth-wrapper">
        <div class="auth-card">
            
            <div class="auth-tabs">
                <button class="auth-tab-btn active" id="tab-login" onclick="switchTab('login')">Log In</button>
                <button class="auth-tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <div id="login-form-box" class="form-container active">
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" required placeholder="name@domain.com">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="submit-btn">Enter Arena</button>
                </form>
            </div>

            <div id="signup-form-box" class="form-container">
                <form id="signup-form">
                    <div class="form-group">
                        <label for="signup-tag">Gamer Tag</label>
                        <input type="text" id="signup-tag" required placeholder="e.g., RoguePixel_99">
                    </div>
                    <div class="form-group">
                        <label for="signup-email">Email Address</label>
                        <input type="email" id="signup-email" required placeholder="player@domain.com">
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Create Password</label>
                        <input type="password" id="signup-password" required minlength="6" placeholder="Minimum 6 characters">
                    </div>
                    <button type="submit" class="submit-btn">Register Profile</button>
                </form>
            </div>

            <div id="auth-feedback" class="auth-msg"></div>
        </div>
    </div>

    <!-- Supabase JS CDN Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
